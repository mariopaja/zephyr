# LAN9250 on the Arduino SPI, connected back-to-back to the time
# transmitter (e.g. nucleo_h563zi with the default sample settings).
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::2"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.2"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.1"

# Never become grandmaster, so that the LAN9250 clock is synchronized
CONFIG_NET_GPTP_GM_CAPABLE=n
CONFIG_NET_GPTP_MONITOR_SYNC_STATUS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NET_GPTP_NEIGHBOR_PROP_DELAY_THR=1000000

# SPI1 transfers with DMA
CONFIG_SPI_STM32_DMA=y
