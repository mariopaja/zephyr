description: STM32 SAI Block controller

compatible: "st,stm32-sai"

include: base.yaml

properties:
  reg:
    required: true

  ranges:
    required: true

  clock-names:
    required: true
    enum:
      - "sai_ck"
      - "sai_ker_ck"
      - "sai_b_ker_ck"
    description: |
      Expected names are the following:
      - "sai_ck" for configuring the peripheral bus clock
      - "sai_ker_ck" for configuring a shared SAI or dedicated SAI A kernel clock
      - "sai_b_ker_ck" for configuring a dedicated SAI B kernel clock

      Depending on the platform, SAI A and SAI B may either share a single
      kernel clock selector or have independent selectors.

      - Platforms with independent kernel clock selectors must provide the kernel clock
      corresponding to each enabled SAI node.
      For example, "sai_ker_ck" is required for SAI A and "sai_b_ker_ck" for SAI B.

      - Platforms with a shared kernel clock selector only need to provide "sai_ker_ck",
      which applies to both SAI A and SAI B.

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

child-binding:
  description: SAI Sub-Block instances linked to SAI Block Controller

  include:
    - name: pinctrl-device.yaml
    - name: i2s-controller.yaml
      property-blocklist: [compatible]

  properties:
    reg:
      required: true

    dmas:
      required: true

    dma-names:
      required: true
      description: |
        DMA channel name: "tx" or "rx", depending of expected device behavior.
      enum: [tx, rx]

    pinctrl-0:
      required: true

    pinctrl-names:
      required: true

    mclk-enable:
      type: boolean
      description: |
        Master Clock Output function.
        An mck pin must be listed within pinctrl-0 when enabling this property.

    mclk-divider:
      type: string
      default: "no-div"
      description: |
        Master Clock Divider Configuration.

        When no-div property is present:
        - MCKDIV = SAI_CK_x / (FS * (FRL + 1))
        Otherwise:
        - MCKDIV = SAI_CK_x / (FS * (OSR + 1) * 256)

        When div-256 is present OSR is set to 0.
        When div-512 is present OSR is set to 1.
      enum:
        - "no-div"
        - "div-256"
        - "div-512"

    synchronous:
      type: boolean
      description: |
        Synchronous mode.
        When present, the SAI controller is configured to work in synchronous mode.

    fifo-threshold:
      type: string
      default: "full"
      description: |
        SAI Block Fifo Threshold defines the fill level at which the peripheral
        triggers a DMA request or interrupt to transfer data
      enum:
        - "empty"
        - "1/4"
        - "1/2"
        - "3/4"
        - "full"

    st,sai-mode:
      type: string
      default: "i2s"
      description: |
        SAI Block operating mode.
        - "i2s": standard I2S/PCM audio interface (default).
        - "pdm": PDM microphone interface. The block demodulates one or more
          PDM bitstreams into PCM samples in hardware. Only usable on a
          sub-block that carries the st,sai-pdm-capable property (set at the
          SoC devicetree level on whichever specific SAI instance/block the
          silicon wires up for PDM, e.g. SAI1 block A on STM32H5).
      enum:
        - "i2s"
        - "pdm"

    st,sai-pdm-capable:
      type: boolean
      description: |
        Marks this specific SAI sub-block as wired in silicon to the PDM
        microphone interface. PDM support is not a property of "block A" in
        general: on a given SoC, only one specific SAI instance/block
        implements it (e.g. SAI1 block A, never SAI2/SAI3/SAI4 block A).
        This property belongs in the SoC-level devicetree, not in a board
        overlay, and gates whether st,sai-mode = "pdm" is accepted.

    st,sai-pdm-mic-pairs:
      type: int
      default: 1
      description: |
        Number of PDM microphone pairs to capture. Each pair is demodulated
        into one stereo PCM channel. Only relevant when st,sai-mode = "pdm".
      enum:
        - 1
        - 2
        - 3

    st,sai-pdm-clock:
      type: string
      default: "clock1"
      description: |
        PDM clock output(s) driving the microphones (SAI_CKx pins).
        "clock1" enables CK1 only, "clock2" enables CK2 only, and "both"
        enables CK1 and CK2 together. CK2 is only needed when capturing
        more microphone pairs than a single clock domain supports. Only
        relevant when st,sai-mode = "pdm".
      enum:
        - "clock1"
        - "clock2"
        - "both"

    st,sai-pdm-volume:
      type: int
      default: 16
      description: |
        Runtime gain applied by the PDM->PCM decimation filter (ST's
        OpenPDMFilter, when CONFIG_I2S_STM32_SAI_PDM=y), relative to its
        fixed full-scale reference of 64. Valid range 0-64; higher values
        increase gain and clipping risk. Tune per microphone
        sensitivity/wiring. Only relevant when st,sai-mode = "pdm".

    st,sai-pdm-mono:
      type: boolean
      description: |
        Only one channel of the mic pair (see st,sai-pdm-mono-channel) is
        physically wired to a real microphone. When set, the PDM->PCM
        decimation filter (CONFIG_I2S_STM32_SAI_PDM=y) only processes that
        channel and delivers compact mono PCM, instead of interleaved
        stereo with noise/garbage in the other channel's slots. Only
        relevant when st,sai-mode = "pdm".

    st,sai-pdm-mono-channel:
      type: string
      default: "a"
      description: |
        Which channel of the mic pair the real microphone is wired to, in
        mono mode (st,sai-pdm-mono). PDM mics that share a clock/data bus
        pick their slot via a SEL/L-R pin: "a" is the first slot (mic's
        SEL tied for the falling/first edge), "b" is the second. Getting
        this wrong means decoding an undriven slot -- plausible-looking
        but meaningless PCM (no real audio content), not silence or an
        obvious error. Only relevant when st,sai-mode = "pdm" and
        st,sai-pdm-mono is set.
      enum:
        - "a"
        - "b"
