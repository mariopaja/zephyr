# Common properties of the LAN9250, whatever host bus it is connected to

include: ethernet-controller.yaml

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: |
      The interrupt pin of LAN9250 is active low.
      If connected directly the MCU pin should be configured
      as active low.

  reset-gpios:
    type: phandle-array
    description: The reset pin of LAN9250.
